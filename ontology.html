<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PedAnalyze: Pedestrian Behavior Annotator</title>
  <link rel="icon" type="image/x-icon" href="simplified logo.png">
  <link rel="stylesheet" href="ontology_styles.css">
  <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
  <div class="container">
    <div class="left-column">
      <div class="header">
        <div class="video-input annotation-header">
          <button id="home-button" class="back-button">Back</button>
          <h2 id="annotation-title" class="annotation-title">Annotation</h2>
        </div>
        <input type="text" id="video-url" placeholder="Enter YouTube video URL" hidden>
        <button id="load-video" hidden>Load Video</button>
      </div>
      <div class="video-player" id="video-player">
      </div>
      <div class="video-navigation">
        <div class="frame-header">
          <div id="frame-count">Frame: 0</div>
          <div class="frame-set-buttons">
            <button id="use-start-frame" disabled>Use as Start</button>
            <button id="use-end-frame" disabled>Use as End</button>
          </div>
        </div>
        <input type="range" id="current-frame" min="0" max="1000" value="0" disabled>
        <div class="controls">
          <div class="frame-jump">
            <input type="number" id="frame-jump-input-backward" placeholder="Frames Backward" disabled>
            <button id="frame-jump-button-backward" disabled>Jump Backward</button>
          </div>
          <button id="previous-frame" disabled>&lt;1 s</button>
          <button id="play-pause" disabled>Play</button>
          <button id="next-frame" disabled>&gt;1 s</button>
              <div class="frame-jump">
                <input type="number" id="frame-jump-input" placeholder="Frames Forward" disabled>
                <button id="frame-jump-button" disabled>Jump Forward</button>
              </div>
        </div>

        <div class="select-annotations">
          <div class="annotation-options" id="annotation-options">
            <input type="radio" id="single frame" name="select_annotations" value="single frame" disabled>
            <label for="single frame" , style="color: #2a2a2a;">Single Frame</label><br>
            <input type="radio" id="multi frame" name="select_annotations" value="multi frame" checked disabled>
            <label for="multi frame" , style="color: #2a2a2a;">Multi Frame</label><br>
          </div>
          <div class="frame-options" , style="margin: 20px">
            <div class="frame-input">
              <label for="start-frame" id="start-frame-label">Start Frame: </label>
              <input type="text" id="start-frame" name="frame-options" placeholder="0" disabled>
            </div>
            <div class="frame-input">
              <label for="end-frame" id="end-frame-label">End Frame: </label>
              <input type="text" id="end-frame" name="frame-options" placeholder="1000" disabled>
            </div>
          </div>
          <div class="lock-video-btn-container">
            <button id="lock-video" class="lock-video-btn" disabled>Lock Video</button>
          </div>
        </div>
      </div>
    </div>
    <div class="right-column">
      <div id="lock-hint" class="hint-banner" role="status" aria-live="polite" style="display: none;">
        Lock the video to a frame (or frame range) to start annotating.
      </div>
      <div class="tab-buttons">
        <button class="tab-button active" data-tab="pedestrian" disabled>Pedestrian</button>
        <button class="tab-button" data-tab="vehicle" disabled>Vehicle</button>
        <button class="tab-button" data-tab="environment" disabled>Environment</button>
        <button class="tab-button" data-tab="archetypes" disabled>Archetypes</button>
        <button class="tab-button" data-tab="all" disabled>Show All Annotations</button>
      </div>
      <div class="tab-content">
        <div id="pedestrian-content" class="tab-pane active">
          <div class="search-bar">
            <input type="text" id="search-pedestrian-tag" placeholder="Search Pedestrian Tag" disabled>
          </div>
          <div id="pedestrian-tag-container" class="tag-container"></div>
        </div>
        <div id="vehicle-content" class="tab-pane">
          <div class="search-bar">
            <input type="text" id="search-vehicle-tag" placeholder="Search Vehicle Tag" disabled>
          </div>
          <div id="vehicle-tag-container" class="tag-container"></div>
        </div>
        <div id="environment-content" class="tab-pane">
          <div class="search-bar">
            <input type="text" id="search-environment-tag" placeholder="Search Environment Tag" disabled>
          </div>
          <div id="environment-tag-container" class="tag-container"></div>
        </div>
        <div id="archetypes-content" class="tab-pane">
          <div class="search-bar">
            <input type="text" id="search-archetypes-tag" placeholder="Search Archetypes Tag" disabled>
          </div>
          <div class="suggested-archetypes-section">
            <label for="suggested-archetypes" id="suggested-archetypes-label">
              <strong>Suggested Archetypes</strong>
            </label>
            <div class="suggested-archetypes" id="suggested-archetypes"></div>
          </div>
          <div id="archetypes-tag-container" class="tag-container"></div>
        </div>
        <div id="all-content" class="tab-pane">
          <h3>All Annotations</h3>
          <div class="search-bar">
            <input type="text" id="search-annotation-tag" placeholder="Search by tag">
          </div>
          <div id="all-annotations-container"></div>
          <button id="download-json-btn" class="save-annotations-btn" disabled>Download JSON</button>
        </div>
      </div>
      <div class="notes-panel">
        <label for="additional-annotations" id="additional-annotations-label"><strong>Additional Details/Notes</strong></label>
        <textarea id="additional-annotations" rows="2" placeholder="Optional notes…" disabled></textarea>
      </div>
      <div id="save-annotations-button"></div>
      <button id="save-all-annotations" class="save-annotations-btn" disabled>Save Annotations</button>
    </div>
  </div>

  <!-- Confirm-before-save modal -->
  <div id="confirm-save-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-save-title">
      <div class="modal-header">
        <h3 id="confirm-save-title">Confirm annotation before saving</h3>
      </div>
      <div class="modal-body">
        <div class="modal-meta" id="confirm-save-meta"></div>

        <div class="modal-section">
          <label for="confirm-save-notes"><strong>Notes</strong></label>
          <textarea id="confirm-save-notes" rows="3" placeholder="Optional notes…"></textarea>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">Selected tags (uncheck to remove)</div>
          <div class="modal-tags-grid">
            <div class="modal-tags-col">
              <div class="modal-tags-heading">Pedestrian</div>
              <div id="confirm-tags-ped" class="modal-tags-list"></div>
            </div>
            <div class="modal-tags-col">
              <div class="modal-tags-heading">Vehicle</div>
              <div id="confirm-tags-ego" class="modal-tags-list"></div>
            </div>
            <div class="modal-tags-col">
              <div class="modal-tags-heading">Environment</div>
              <div id="confirm-tags-env" class="modal-tags-list"></div>
            </div>
            <div class="modal-tags-col">
              <div class="modal-tags-heading">Archetypes</div>
              <div id="confirm-tags-arch" class="modal-tags-list"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="confirm-save-back" class="modal-btn secondary">Back</button>
        <button type="button" id="confirm-save-confirm" class="modal-btn primary">Confirm &amp; Save</button>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('load', () => {
      if (window.initializeVideoFromQuery) {
        window.initializeVideoFromQuery();
      }
    });
  </script>
  <script src="ontology_script.js"></script>
</body>

</html>
